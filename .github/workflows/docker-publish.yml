name: Build and Push Docker Image to GHCR

on:
  schedule:
    # 每天 00:00 UTC (北京时间 08:00) 自动检测上游更新
    - cron: '0 0 * * *'
  push:
    branches: [ "pi-agent-pichamber" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "pi-agent-pichamber" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hhnice510/pi-agent-pichamber

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for checking npm versions)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check upstream NPM versions
        id: check_upstream
        run: |
          PI_VER=$(npm view @earendil-works/pi-coding-agent version 2>/dev/null || echo "0.0.0")
          PICHAMBER_VER=$(npm view @amagicpear/pichamber version 2>/dev/null || echo "0.0.0")
          COMBINED_VER="pi-${PI_VER}_pichamber-${PICHAMBER_VER}"
          echo "Upstream versions: pi=${PI_VER}, pichamber=${PICHAMBER_VER}"
          echo "pi_version=${PI_VER}" >> $GITHUB_OUTPUT
          echo "pichamber_version=${PICHAMBER_VER}" >> $GITHUB_OUTPUT
          echo "combined_version=${COMBINED_VER}" >> $GITHUB_OUTPUT
          echo "${COMBINED_VER}" > .last_built_version

      - name: Restore last built version cache
        id: cache_version
        uses: actions/cache/restore@v4
        with:
          path: .last_built_version
          key: upstream-ver-pi-agent-pichamber-${{ steps.check_upstream.outputs.combined_version }}

      - name: Determine if build is required
        id: build_decision
        run: |
          if [ "${{ steps.cache_version.outputs.cache-hit }}" = "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Upstream versions (${{ steps.check_upstream.outputs.combined_version }}) have not changed since last build."
            echo "Skipping Docker image build for scheduled run."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream version or non-scheduled trigger. Proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.build_decision.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.build_decision.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: steps.build_decision.outputs.should_build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.build_decision.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.check_upstream.outputs.combined_version }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        if: steps.build_decision.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            PI_VERSION=${{ steps.check_upstream.outputs.pi_version }}
            PICHAMBER_VERSION=${{ steps.check_upstream.outputs.pichamber_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Save built version cache
        if: steps.build_decision.outputs.should_build == 'true' && github.event_name != 'pull_request' && steps.cache_version.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .last_built_version
          key: upstream-ver-pi-agent-pichamber-${{ steps.check_upstream.outputs.combined_version }}
