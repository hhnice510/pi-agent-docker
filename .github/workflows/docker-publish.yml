name: Build and Push Docker Image to GHCR

on:
  schedule:
    # 每天 00:00 UTC (北京时间 08:00) 自动检测上游更新
    - cron: '0 0 * * *'
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for checking npm versions)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check upstream NPM versions
        id: check_upstream
        run: |
          PI_VER=$(npm view @earendil-works/pi-coding-agent version 2>/dev/null || echo "0.0.0")
          WEB_VER=$(npm view @agegr/pi-web version 2>/dev/null || echo "0.0.0")
          COMBINED_VER="pi-${PI_VER}_web-${WEB_VER}"
          echo "Upstream versions: pi=${PI_VER}, pi-web=${WEB_VER}"
          echo "combined_version=${COMBINED_VER}" >> $GITHUB_OUTPUT
          echo "${COMBINED_VER}" > .last_built_version

      - name: Restore last built version cache
        id: cache_version
        uses: actions/cache/restore@v4
        with:
          path: .last_built_version
          key: upstream-ver-${{ steps.check_upstream.outputs.combined_version }}

      - name: Determine if build is required
        id: build_decision
        run: |
          if [ "${{ steps.cache_version.outputs.cache-hit }}" = "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Upstream versions (${{ steps.check_upstream.outputs.combined_version }}) have not changed since last build."
            echo "Skipping Docker image build for scheduled run."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream version or non-scheduled trigger. Proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.build_decision.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.build_decision.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: steps.build_decision.outputs.should_build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.build_decision.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ steps.check_upstream.outputs.combined_version }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        if: steps.build_decision.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 不使用 GHA 层缓存：之前 cache-from/to: type=gha 复用了旧的
          # entrypoint.sh 层，导致打出的镜像 code-server 仍绑在错误的端口。
          # 每次全量重建，确保提交进仓库的 Dockerfile/entrypoint 被正确打进镜像。

      - name: Save built version cache
        if: steps.build_decision.outputs.should_build == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .last_built_version
          key: upstream-ver-${{ steps.check_upstream.outputs.combined_version }}
