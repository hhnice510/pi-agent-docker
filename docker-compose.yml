version: '3.8'

services:
  pi-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/hhnice510/pi-agent-docker:latest
    container_name: pi-agent
    restart: unless-stopped
    ports:
      - "${PORT:-30141}:${PORT:-30141}"
    environment:
      - PORT=${PORT:-30141}
      - PI_WEB_PASSWORD=${PI_WEB_PASSWORD:-}
      # Auto update packages on container start (true/false)
      - AUTO_UPDATE=${AUTO_UPDATE:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # HTTP Proxy for pi-web server-side model/API requests (optional)
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
    extra_hosts:
      # Allow containers to reach the Docker host via host.docker.internal
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist Pi agent configuration, sessions, extensions and settings (~/.pi)
      - pi_data:/root/.pi
      # Persist coding projects workspace
      - ./workspace:/workspace

volumes:
  pi_data:
    name: pi_agent_data
