services:
  pi-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/hhnice510/pi-agent-pichamber:latest
    container_name: pi-agent-pichamber
    restart: unless-stopped
    ports:
      # Pichamber Web UI 端口
      - "${PICHAMBER_PORT:-3000}:3000"
    volumes:
      # 挂载工作区目录（宿主机的代码项目映射到容器中的 /workspace）
      - ./workspace:/workspace
      # 持久化 Pi Agent 配置、会话历史、扩展与 Git 凭据
      - pi_data:/root/.pi
    environment:
      # 模型 API 密钥（按需在 .env 中配置）
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # 代理设置（若宿主机运行代理软件如 Clash/Surge，请在 .env 中启用）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
      # 容器启动时自动检查更新 NPM 包（可选，默认 false）
      - AUTO_UPDATE=${AUTO_UPDATE:-false}
      - PORT=3000
    extra_hosts:
      # 允许容器内使用 host.docker.internal 访问宿主机服务（如代理、本地 LLM 服务）
      - "host.docker.internal:host-gateway"

volumes:
  pi_data:
    name: pi_pichamber_data
