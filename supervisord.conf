[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock

; pi-web and code-server program configs live in conf.d/ (code-server is written
; conditionally by entrypoint.sh based on CODE_SERVER_ENABLED).
[include]
files = /etc/supervisor/conf.d/*.conf

[program:pi-web]
command=pi-web -H 0.0.0.0 -p 30141 --no-open %(ENV_PI_WEB_ARGS)s
autostart=true
autorestart=true
startsecs=3
stopsignal=SIGTERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
