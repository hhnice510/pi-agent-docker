[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Only the Pi Web UI is supervised here (no code-server on the web-only branch).
; The /bin/sh -c wrapper lets PORT and PI_WEB_EXTRA_ARGS be expanded at runtime.
[program:pi-web]
command=/bin/sh -c 'exec pi-web -H 0.0.0.0 -p ${PORT:-30141} --no-open ${PI_WEB_EXTRA_ARGS:-}'
autostart=true
autorestart=true
stopsignal=SIGTERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
