[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:pi-web]
command=pi-web -H 0.0.0.0 -p 30141 --no-open
autostart=true
autorestart=true
stopsignal=SIGTERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:code-server]
command=code-server --bind-addr 0.0.0.0:8443 --auth password --user-data-dir /root/.pi/code-server --extensions-dir /root/.pi/code-server/extensions --disable-telemetry --disable-update-check /workspace
environment=PASSWORD="%(ENV_PASSWORD)s"
autostart=true
autorestart=true
stopsignal=SIGTERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
